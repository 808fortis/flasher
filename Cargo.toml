[package]
name = "flasher"
version = "0.1.0"
edition = "2021"

[dependencies]
imgui = { version = "0.12", features = ["tables-api"] }
imgui-winit-support = "0.13"
imgui-wgpu = "0.28"
winit = "0.30"
wgpu = "29"
rusb = { version = "0.9", features = ["vendored"] }
rfd = "0.15"
anyhow = "1"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
